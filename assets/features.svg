<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <rect width="1200" height="640" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="600" y="70" fill="#0f172a" font-size="34" font-weight="800" text-anchor="middle">核心功能一览</text>
  <text x="600" y="104" fill="#64748b" font-size="17" text-anchor="middle">一个后台，搞定企业官网的内容、品牌与前端展示</text>

  <!-- 卡片网格 -->
  <g font-size="0">
    <!-- 卡片模板坐标：每张 360x220，间距 30，起始 x=60,y=150 -->
    <!-- 1 栏目/文章/产品 -->
    <g transform="translate(60,150)">
      <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="58" r="28" fill="#eef2ff"/>
      <path d="M44 50h24M44 58h18M44 66h24" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
      <text x="100" y="52" fill="#0f172a" font-size="20" font-weight="700">栏目 / 文章 / 产品</text>
      <text x="100" y="76" fill="#94a3b8" font-size="13">内容管理</text>
      <text x="28" y="120" fill="#475569" font-size="14">树形父子栏目自动生成导航；文章与产品</text>
      <text x="28" y="144" fill="#475569" font-size="14">独立 CRUD，支持推荐位、上下架、SEO。</text>
      <text x="28" y="176" fill="#6366f1" font-size="13" font-weight="600">▶ 栏目管理 · 内容管理 · 产品管理</text>
    </g>

    <!-- 2 图片空间 -->
    <g transform="translate(450,150)">
      <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="58" r="28" fill="#ecfeff"/>
      <rect x="44" y="44" width="24" height="20" rx="4" fill="#06b6d4"/>
      <circle cx="62" cy="52" r="5" fill="#ecfeff"/>
      <text x="100" y="52" fill="#0f172a" font-size="20" font-weight="700">图片空间</text>
      <text x="100" y="76" fill="#94a3b8" font-size="13">素材管理</text>
      <text x="28" y="120" fill="#475569" font-size="14">上传 / 预览 / 复制链接 / 删除，支持</text>
      <text x="28" y="144" fill="#475569" font-size="14">jpg·png·gif·webp，按月自动分目录。</text>
      <text x="28" y="176" fill="#0891b2" font-size="13" font-weight="600">▶ 图片上传 · 外链复制 · 目录管理</text>
    </g>

    <!-- 3 全国分站 -->
    <g transform="translate(840,150)">
      <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="58" r="28" fill="#f0fdf4"/>
      <path d="M56 40c10 8 16 14 16 22a16 16 0 1 1-32 0c0-8 6-14 16-22z" fill="#22c55e"/>
      <text x="100" y="52" fill="#0f172a" font-size="20" font-weight="700">全国分站</text>
      <text x="100" y="76" fill="#94a3b8" font-size="13">站群 SEO</text>
      <text x="28" y="120" fill="#475569" font-size="14">总开关 + 城市管理；开启后前台自动切换</text>
      <text x="28" y="144" fill="#475569" font-size="14">标题后缀与关键词，城市站群思路。</text>
      <text x="28" y="176" fill="#16a34a" font-size="13" font-weight="600">▶ 分站开关 · 城市配置 · 站群</text>
    </g>

    <!-- 4 主题设置 -->
    <g transform="translate(60,400)">
      <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="58" r="28" fill="#fef3c7"/>
      <circle cx="48" cy="50" r="7" fill="#f59e0b"/>
      <circle cx="64" cy="50" r="7" fill="#fbbf24"/>
      <circle cx="48" cy="66" r="7" fill="#fcd34d"/>
      <circle cx="64" cy="66" r="7" fill="#f59e0b"/>
      <text x="100" y="52" fill="#0f172a" font-size="20" font-weight="700">主题设置</text>
      <text x="100" y="76" fill="#94a3b8" font-size="13">品牌与配置</text>
      <text x="28" y="120" fill="#475569" font-size="14">站名、电话、地址、配色、语言、SEO、</text>
      <text x="28" y="144" fill="#475569" font-size="14">联系与备案号，单页一次保存全站生效。</text>
      <text x="28" y="176" fill="#d97706" font-size="13" font-weight="600">▶ 品牌 · 配色 · SEO · 备案</text>
    </g>

    <!-- 5 首页DIY可视化 -->
    <g transform="translate(450,400)">
      <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="58" r="28" fill="#faf5ff"/>
      <rect x="42" y="46" width="28" height="6" rx="3" fill="#a855f7"/>
      <rect x="42" y="56" width="28" height="6" rx="3" fill="#c084fc"/>
      <rect x="42" y="66" width="20" height="6" rx="3" fill="#a855f7"/>
      <text x="100" y="52" fill="#0f172a" font-size="20" font-weight="700">首页 DIY 可视化</text>
      <text x="100" y="76" fill="#94a3b8" font-size="13">拖拽编辑</text>
      <text x="28" y="120" fill="#475569" font-size="14">首页各模块的文案、图片、排序、显隐，</text>
      <text x="28" y="144" fill="#475569" font-size="14">在后台拖拽即可完成，所见即所得。</text>
      <text x="28" y="176" fill="#9333ea" font-size="13" font-weight="600">▶ 模块排序 · 显隐 · 文案图</text>
    </g>

    <!-- 6 自定义表单 -->
    <g transform="translate(840,400)">
      <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="58" r="28" fill="#fff1f2"/>
      <rect x="44" y="46" width="24" height="24" rx="4" fill="#f43f5e"/>
      <path d="M50 54h12M50 60h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="100" y="52" fill="#0f172a" font-size="20" font-weight="700">自定义表单</text>
      <text x="100" y="76" fill="#94a3b8" font-size="13">在线收集</text>
      <text x="28" y="120" fill="#475569" font-size="14">在线报名、咨询、留言等表单自由配置，</text>
      <text x="28" y="144" fill="#475569" font-size="14">线索统一进入后台管理。</text>
      <text x="28" y="176" fill="#e11d48" font-size="13" font-weight="600">▶ 报名 · 咨询 · 留言</text>
    </g>
  </g>
</svg>
