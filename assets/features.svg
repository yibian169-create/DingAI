<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="600" y="70" fill="#0f172a" font-size="34" font-weight="800" text-anchor="middle">核心功能一览</text>
  <text x="600" y="104" fill="#64748b" font-size="17" text-anchor="middle">一个后台，搞定企业官网的内容、品牌、前端与 AI 搜索可见性</text>

  <!-- GEO 焦点宽卡 -->
  <g transform="translate(60,140)">
    <rect width="1080" height="130" rx="18" fill="url(#gGrad)"/>
    <circle cx="92" cy="65" r="36" fill="#ffffff" opacity="0.18"/>
    <path d="M92 33a32 32 0 1 1 0 64 32 32 0 1 1 0-64zM60 65h64M92 33c14 12 14 52 0 64M92 33c-14 12-14 52 0 64" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.85"/>
    <text x="150" y="62" fill="#ffffff" font-size="26" font-weight="800">GEO 中心（核心卖点）</text>
    <text x="150" y="94" fill="#e9e8ff" font-size="15">让 DeepSeek、豆包、Kimi、文心、ChatGPT 在回答客户问题时<tspan font-weight="700" fill="#ffffff">优先推荐你的网站</tspan></text>
    <text x="150" y="120" fill="#dcdcff" font-size="13.5">全站 GEO 体检打分 · AI 问答库生成 · 自动 FAQ 卡片 · AI 引用率 / 竞品 / 负面监控</text>
    <rect x="884" y="44" width="150" height="42" rx="21" fill="#ffffff" opacity="0.2"/>
    <text x="959" y="71" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">★ 生成式引擎优化</text>
  </g>

  <!-- 卡片网格 -->
  <g font-size="0">
    <!-- 1 栏目/文章/产品 -->
    <g transform="translate(60,300)">
      <rect width="360" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="54" r="28" fill="#eef2ff"/>
      <path d="M44 46h24M44 54h18M44 62h24" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
      <text x="100" y="48" fill="#0f172a" font-size="20" font-weight="700">栏目 / 文章 / 产品</text>
      <text x="100" y="72" fill="#94a3b8" font-size="13">内容管理</text>
      <text x="28" y="112" fill="#475569" font-size="14">树形父子栏目自动生成导航；文章与产品</text>
      <text x="28" y="136" fill="#475569" font-size="14">独立 CRUD，支持推荐位、上下架、SEO。</text>
      <text x="28" y="168" fill="#6366f1" font-size="13" font-weight="600">▶ 栏目管理 · 内容管理 · 产品管理</text>
    </g>

    <!-- 2 图片空间 -->
    <g transform="translate(450,300)">
      <rect width="360" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="54" r="28" fill="#ecfeff"/>
      <rect x="44" y="40" width="24" height="20" rx="4" fill="#06b6d4"/>
      <circle cx="62" cy="48" r="5" fill="#ecfeff"/>
      <text x="100" y="48" fill="#0f172a" font-size="20" font-weight="700">图片空间</text>
      <text x="100" y="72" fill="#94a3b8" font-size="13">素材管理</text>
      <text x="28" y="112" fill="#475569" font-size="14">上传 / 预览 / 复制链接 / 删除，支持</text>
      <text x="28" y="136" fill="#475569" font-size="14">jpg·png·gif·webp，按月自动分目录。</text>
      <text x="28" y="168" fill="#0891b2" font-size="13" font-weight="600">▶ 图片上传 · 外链复制 · 目录管理</text>
    </g>

    <!-- 3 全国分站 -->
    <g transform="translate(840,300)">
      <rect width="360" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="54" r="28" fill="#f0fdf4"/>
      <path d="M56 36c10 8 16 14 16 22a16 16 0 1 1-32 0c0-8 6-14 16-22z" fill="#22c55e"/>
      <text x="100" y="48" fill="#0f172a" font-size="20" font-weight="700">全国分站</text>
      <text x="100" y="72" fill="#94a3b8" font-size="13">站群 SEO</text>
      <text x="28" y="112" fill="#475569" font-size="14">总开关 + 城市管理；开启后前台自动切换</text>
      <text x="28" y="136" fill="#475569" font-size="14">标题后缀与关键词，城市站群思路。</text>
      <text x="28" y="168" fill="#16a34a" font-size="13" font-weight="600">▶ 分站开关 · 城市配置 · 站群</text>
    </g>

    <!-- 4 主题设置 -->
    <g transform="translate(60,540)">
      <rect width="360" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="54" r="28" fill="#fef3c7"/>
      <circle cx="48" cy="46" r="7" fill="#f59e0b"/>
      <circle cx="64" cy="46" r="7" fill="#fbbf24"/>
      <circle cx="48" cy="62" r="7" fill="#fcd34d"/>
      <circle cx="64" cy="62" r="7" fill="#f59e0b"/>
      <text x="100" y="48" fill="#0f172a" font-size="20" font-weight="700">主题设置</text>
      <text x="100" y="72" fill="#94a3b8" font-size="13">品牌与配置</text>
      <text x="28" y="112" fill="#475569" font-size="14">站名、电话、地址、配色、语言、SEO、</text>
      <text x="28" y="136" fill="#475569" font-size="14">联系与备案号，单页一次保存全站生效。</text>
      <text x="28" y="168" fill="#d97706" font-size="13" font-weight="600">▶ 品牌 · 配色 · SEO · 备案</text>
    </g>

    <!-- 5 首页DIY可视化 -->
    <g transform="translate(450,540)">
      <rect width="360" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="54" r="28" fill="#faf5ff"/>
      <rect x="42" y="42" width="28" height="6" rx="3" fill="#a855f7"/>
      <rect x="42" y="52" width="28" height="6" rx="3" fill="#c084fc"/>
      <rect x="42" y="62" width="20" height="6" rx="3" fill="#a855f7"/>
      <text x="100" y="48" fill="#0f172a" font-size="20" font-weight="700">首页 DIY 可视化</text>
      <text x="100" y="72" fill="#94a3b8" font-size="13">拖拽编辑</text>
      <text x="28" y="112" fill="#475569" font-size="14">首页各模块的文案、图片、排序、显隐，</text>
      <text x="28" y="136" fill="#475569" font-size="14">在后台拖拽即可完成，所见即所得。</text>
      <text x="28" y="168" fill="#9333ea" font-size="13" font-weight="600">▶ 模块排序 · 显隐 · 文案图</text>
    </g>

    <!-- 6 自定义表单 -->
    <g transform="translate(840,540)">
      <rect width="360" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="56" cy="54" r="28" fill="#fff1f2"/>
      <rect x="44" y="42" width="24" height="24" rx="4" fill="#f43f5e"/>
      <path d="M50 50h12M50 56h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="100" y="48" fill="#0f172a" font-size="20" font-weight="700">自定义表单</text>
      <text x="100" y="72" fill="#94a3b8" font-size="13">在线收集</text>
      <text x="28" y="112" fill="#475569" font-size="14">在线报名、咨询、留言等表单自由配置，</text>
      <text x="28" y="136" fill="#475569" font-size="14">线索统一进入后台管理。</text>
      <text x="28" y="168" fill="#e11d48" font-size="13" font-weight="600">▶ 报名 · 咨询 · 留言</text>
    </g>
  </g>
</svg>
