<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>

  <text x="600" y="64" fill="#0f172a" font-size="32" font-weight="800" text-anchor="middle">GEO 中心 · 让 AI 优先推荐你的网站</text>
  <text x="600" y="96" fill="#64748b" font-size="16" text-anchor="middle">生成式引擎优化（GEO）：让你的官网出现在 DeepSeek / 豆包 / Kimi / 文心 / ChatGPT 的答案里</text>

  <!-- 卡1 体检 -->
  <g transform="translate(60,130)">
    <rect width="360" height="210" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="56" cy="56" r="28" fill="#eef2ff"/>
    <path d="M44 56a12 12 0 1 1 24 0" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M44 56l7 7 12-14" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="50" fill="#0f172a" font-size="20" font-weight="700">GEO 体检</text>
    <text x="100" y="74" fill="#94a3b8" font-size="13">全站健康度 0-100</text>
    <text x="28" y="116" fill="#475569" font-size="14">综合健康度评分，逐项体检：</text>
    <text x="28" y="140" fill="#475569" font-size="14">文章问答卡、标题关键词、实体</text>
    <text x="28" y="164" fill="#475569" font-size="14">一致性、问答覆盖率，缺哪补哪。</text>
    <text x="28" y="196" fill="#4f46e5" font-size="13" font-weight="600">▶ 一键体检 · 红黄绿提示</text>
  </g>

  <!-- 卡2 内容生成 -->
  <g transform="translate(450,130)">
    <rect width="360" height="210" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="56" cy="56" r="28" fill="#ecfeff"/>
    <rect x="44" y="44" width="20" height="24" rx="3" fill="#06b6d4"/>
    <path d="M49 50l3 3 6-7" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="50" fill="#0f172a" font-size="20" font-weight="700">GEO 内容生成</text>
    <text x="100" y="74" fill="#94a3b8" font-size="13">AI 自动产出问答资产</text>
    <text x="28" y="116" fill="#475569" font-size="14">商家介绍、客户问题词蒸馏、</text>
    <text x="28" y="140" fill="#475569" font-size="14">品牌资料库；AI 问答库一键变</text>
    <text x="28" y="164" fill="#475569" font-size="14">文章，自动带上 FAQ 卡片。</text>
    <text x="28" y="196" fill="#0891b2" font-size="13" font-weight="600">▶ 问答库 · FAQ · 品牌库</text>
  </g>

  <!-- 卡3 监控 -->
  <g transform="translate(840,130)">
    <rect width="360" height="210" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="56" cy="56" r="28" fill="#f0fdf4"/>
    <path d="M44 64h6v-8h6v8h6v-14h6v14h6" stroke="#22c55e" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="100" y="50" fill="#0f172a" font-size="20" font-weight="700">GEO 监控</text>
    <text x="100" y="74" fill="#94a3b8" font-size="13">AI 有没有提到你</text>
    <text x="28" y="116" fill="#475569" font-size="14">AI 引用率趋势、各平台引用明细、</text>
    <text x="28" y="140" fill="#475569" font-size="14">竞品对比、负面预警，随时掌握</text>
    <text x="28" y="164" fill="#475569" font-size="14">网站在 AI 答案里的存在感。</text>
    <text x="28" y="196" fill="#16a34a" font-size="13" font-weight="600">▶ 引用率 · 竞品 · 负面</text>
  </g>

  <!-- 工作流 -->
  <text x="60" y="386" fill="#0f172a" font-size="18" font-weight="700">工作流</text>
  <g transform="translate(60,402)">
    <rect width="240" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="34" cy="43" r="18" fill="#eef2ff"/>
    <text x="34" y="49" fill="#4f46e5" font-size="17" font-weight="800" text-anchor="middle">1</text>
    <text x="64" y="40" fill="#0f172a" font-size="15" font-weight="700">全站诊断</text>
    <text x="64" y="62" fill="#94a3b8" font-size="12">看清离被推荐还差几步</text>
  </g>
  <path d="M304 445h26M330 439l9 6-9 6" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(340,402)">
    <rect width="240" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="34" cy="43" r="18" fill="#ecfeff"/>
    <text x="34" y="49" fill="#0891b2" font-size="17" font-weight="800" text-anchor="middle">2</text>
    <text x="64" y="40" fill="#0f172a" font-size="15" font-weight="700">生成问答</text>
    <text x="64" y="62" fill="#94a3b8" font-size="12">结合品牌库写标准答案</text>
  </g>
  <path d="M584 445h26M610 439l9 6-9 6" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(620,402)">
    <rect width="240" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="34" cy="43" r="18" fill="#eef2ff"/>
    <text x="34" y="49" fill="#4f46e5" font-size="17" font-weight="800" text-anchor="middle">3</text>
    <text x="64" y="40" fill="#0f172a" font-size="15" font-weight="700">做 FAQ 卡片</text>
    <text x="64" y="62" fill="#94a3b8" font-size="12">给每篇文章加问答卡</text>
  </g>
  <path d="M864 445h26M890 439l9 6-9 6" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(900,402)">
    <rect width="240" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="34" cy="43" r="18" fill="#f0fdf4"/>
    <text x="34" y="49" fill="#16a34a" font-size="17" font-weight="800" text-anchor="middle">4</text>
    <text x="64" y="40" fill="#0f172a" font-size="15" font-weight="700">分发与监控</text>
    <text x="64" y="62" fill="#94a3b8" font-size="12">看 AI 有没有引用你</text>
  </g>
</svg>
