    <rect x="0" y="124" width="166" height="40" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="177" y="124" width="166" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="354" y="124" width="166" height="40" rx="8" fill="#fef3c7" stroke="#fde68a"/>
