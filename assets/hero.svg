<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <circle cx="970" cy="40" r="180" fill="#22d3ee" opacity="0.07"/>
  <circle cx="1080" cy="400" r="150" fill="#818cf8" opacity="0.10"/>
  <circle cx="180" cy="400" r="120" fill="#0ea5e9" opacity="0.06"/>

  <!-- 左侧文案 -->
  <g transform="translate(64,0)">
    <rect x="0" y="64" width="118" height="34" rx="17" fill="#0f172a" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="59" y="86" fill="#a5f3fc" font-size="16" font-weight="700" text-anchor="middle">开源 · MIT</text>

    <text x="0" y="158" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="1">得应盯</text>
    <text x="0" y="206" fill="#e0e7ff" font-size="30" font-weight="700">企业官网 CMS 建站系统</text>

    <text x="0" y="248" fill="#cbd5e1" font-size="17" font-weight="500">零框架依赖 · 宝塔一键部署 · 拖拽式可视化编辑</text>

    <g transform="translate(0,282)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <circle cx="22" cy="20" r="6" fill="#22d3ee"/>
      <text x="40" y="25" fill="#e2e8f0" font-size="14" font-weight="600">栏目/文章/产品</text>

      <rect x="166" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <circle cx="22" cy="20" r="6" fill="#818cf8" transform="translate(166,0)"/>
      <text x="206" y="25" fill="#e2e8f0" font-size="14" font-weight="600">全国分站</text>

      <rect x="302" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
      <circle cx="22" cy="20" r="6" fill="#34d399" transform="translate(302,0)"/>
      <text x="342" y="25" fill="#e2e8f0" font-size="14" font-weight="600">主题与SEO</text>
    </g>

    <text x="0" y="372" fill="#94a3b8" font-size="14">一个后台，管理整站内容、品牌与前端展示</text>
  </g>

  <!-- 右侧：浏览器首页预览 -->
  <g transform="translate(760,70)">
    <rect x="0" y="0" width="392" height="300" rx="16" fill="url(#screen)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="392" height="34" rx="16" fill="#0f172a"/>
    <rect x="0" y="22" width="392" height="12" fill="#0f172a"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="40" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="17" r="5" fill="#22c55e"/>
    <rect x="80" y="9" width="280" height="16" rx="8" fill="#1f2937"/>
    <!-- 首页内容 -->
    <rect x="22" y="50" width="120" height="14" rx="7" fill="#818cf8"/>
    <rect x="22" y="74" width="300" height="26" rx="6" fill="#1e293b"/>
    <rect x="22" y="108" width="240" height="12" rx="6" fill="#cbd5e1"/>
    <g transform="translate(22,140)">
      <rect x="0" y="0" width="104" height="74" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
      <rect x="12" y="12" width="40" height="40" rx="8" fill="#22d3ee" opacity="0.8"/>
      <rect x="12" y="60" width="80" height="8" rx="4" fill="#94a3b8"/>
      <rect x="130" y="0" width="104" height="74" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
      <rect x="142" y="12" width="40" height="40" rx="8" fill="#818cf8" opacity="0.8"/>
      <rect x="142" y="60" width="80" height="8" rx="4" fill="#94a3b8"/>
      <rect x="260" y="0" width="104" height="74" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
      <rect x="272" y="12" width="40" height="40" rx="8" fill="#34d399" opacity="0.8"/>
      <rect x="272" y="60" width="80" height="8" rx="4" fill="#94a3b8"/>
    </g>
    <rect x="22" y="232" width="160" height="34" rx="17" fill="url(#accent)"/>
    <text x="102" y="254" fill="#0b1220" font-size="14" font-weight="700" text-anchor="middle">了解更多</text>
    <rect x="22" y="278" width="348" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- 浮动后台卡片 -->
  <g transform="translate(700,250)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="url(#card)" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="16" y="16" width="90" height="12" rx="6" fill="#a5b4fc"/>
    <rect x="16" y="40" width="168" height="10" rx="5" fill="#475569"/>
    <rect x="16" y="58" width="130" height="10" rx="5" fill="#475569"/>
    <rect x="16" y="84" width="80" height="22" rx="11" fill="#22d3ee"/>
    <text x="56" y="100" fill="#0b1220" font-size="12" font-weight="700" text-anchor="middle">保存配置</text>
  </g>
</svg>
